- prefix: /css-utility/dist
  path: www/css-utility/dist/*.css
- prefix: /css-utility/dist/category
  path: www/css-utility/dist/category/*.css
- prefix: /font/files
  path: www/node_modules/@fontsource/jetbrains-mono/files/*.{woff,woff2}
- prefix: /font
  path: www/node_modules/@fontsource/jetbrains-mono/*.css
- prefix: /js
  path:
  - www/node_modules/pp-is/dist/pp-is.min.js
  - www/node_modules/pp-events/dist/pp-events.min.js
  - www/node_modules/pp-router.js/pp-router.min.js  
  - www/js/*.js
- prefix: /
  path: www/index.html
- prefix: /css
  path: www/css/*.css
- prefix: /css/animate
  path: www/css/animate/*.css
- prefix: /css/animate/fade
  path: www/css/animate/fade/*.css